name: Render illustrated encyclopedia architecture plates

on:
  push:
    branches:
      - docs/pinned-platform-research-reviews-20261019
    paths:
      - '**/diagram.mmd'
      - 'tooling/diagrams/render.py'
      - '.github/workflows/diagrams.yml'
  workflow_dispatch:

concurrency:
  group: illustrated-encyclopedia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install Pillow==11.3.0
      - name: Render every topic-specific architecture PNG
        run: python tooling/diagrams/render.py
      - name: Commit PNG illustrations to feature branch
        run: |
          set -euo pipefail
          git add -- '**/diagram.png' diagram.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: render illustrated encyclopedia architecture PNGs"
            git push
          fi
